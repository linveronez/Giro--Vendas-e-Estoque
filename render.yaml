services:
  - type: web
    name: giro-vendas-estoque
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application"
    healthCheckPath: "/login/"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
